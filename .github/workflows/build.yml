name: Build Portable Windows App

on:
  push:
    branches:
      - 'main'
      - 'dev'
      - 'hotfix/**'
  pull_request:
    branches:
      - 'main'
      - 'dev'

jobs:
  build-windows:
    name: Compile Application for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 shiboken6 pyinstaller xhtml2pdf markdown

      - name: Run PyInstaller Compiler
        run: |
          pyinstaller --noconsole --name="UBS_Signage" --add-data "app_assets;app_assets" main.py

      - name: Structuring Runtime Folders and SmartScreen Patch
        run: |
          # Create reliable runtime resource folders expected by AssetService
          New-Item -ItemType Directory -Force -Path "dist/UBS_Signage/resources/images"
          New-Item -ItemType Directory -Force -Path "dist/UBS_Signage/resources/videos"
          
          # Generate a root-level Batch launcher script to bypass direct SmartScreen binary blocks
          $BatContent = "@echo off`nstart `"`" `"%~dp0UBS_Signage\UBS_Signage.exe`""
          Out-File -FilePath "dist/Iniciar.bat" -InputObject $BatContent -Encoding ascii
        shell: powershell

      - name: Compile USER_MANUAL.md to Production PDF
        run: |
          cat << 'EOF' > generate_pdf.py
          import markdown
          from xhtml2pdf import pisa

          with open('USER_MANUAL.md', 'r', encoding='utf-8') as f:
              md_content = f.read()

          # Strict ASCII normalization to protect the xhtml2pdf engine font engine
          replacements = {
              '📂': '[Pasta]',
              '📄': '[Arq]',
              '⚙️': '[Exec]',
              '⚠️': 'ATENÇÃO:',
              '🚫': 'AVISO:',
              '├──': '|--',
              '└──': '|__',
              '──': '--',
              '│': '|',
              '├': '|',
              '└': '|',
              '─': '-'
          }

          for unicode_char, ascii_text in replacements.items():
              md_content = md_content.replace(unicode_char, ascii_text)
          
          md_html = markdown.markdown(md_content, extensions=['extra'])
          
          html_template = '''<html>
          <head>
          <style>
              @page {
                  size: a4;
                  margin: 2.5cm;
              }
              body { 
                  font-family: Helvetica, Arial, sans-serif; 
                  color: #333; 
                  line-height: 1.5; 
                  font-size: 10pt;
              } 
              h1 { color: #056e9b; border-bottom: 1px solid #056e9b; padding-bottom: 5px; font-size: 20pt; } 
              h2 { color: #1f2833; margin-top: 20px; font-size: 14pt; page-break-after: avoid; } 
              h3 { color: #459cd6; font-size: 12pt; page-break-after: avoid; } 
              
              pre, table, blockquote {
                  page-break-inside: avoid;
              }
              
              code { 
                  background: #f4f4f4; 
                  font-family: Courier, monospace; 
                  font-size: 9pt;
              } 
              pre {
                  background: #f4f4f4;
                  border: 1px solid #ddd;
                  padding: 10px;
                  font-family: Courier, monospace;
                  font-size: 9pt;
                  margin-bottom: 15px;
              }
              table { 
                  border-collapse: collapse; 
                  width: 100%; 
                  margin-top: 15px; 
                  margin-bottom: 15px;
              } 
              th, td { 
                  border: 1px solid #ccb3b3; 
                  padding: 8px; 
                  text-align: left; 
                  font-size: 9pt;
              } 
              th { 
                  background-color: #f8f9fa; 
                  color: #056e9b; 
              } 
              blockquote { 
                  margin: 15px 0; 
                  padding: 10px; 
                  background-color: #fff3cd; 
                  border-left: 4px solid #ffc107; 
                  color: #856404; 
              }
          </style>
          </head>
          <body></body>
          </html>'''
          
          html_content = html_template.replace('', md_html)
          
          with open('dist/Manual_do_Usuario.pdf', 'wb') as f_out:
              pisa.CreatePDF(html_content, dest=f_out)
          EOF
          
          python generate_pdf.py
        shell: bash

      - name: Pack into Portable ZIP Archive
        run: |
          # Compress from the root of the dist directory to include the launcher
          Compress-Archive -Path "dist/*" -DestinationPath "UBS_Signage_Portable_Windows.zip"
        shell: powershell

      - name: Upload Finished Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portable_Windows_Build
          path: UBS_Signage_Portable_Windows.zip
          retention-days: 7

  deploy-docs:
      name: Compile and Publish Doxygen Reference Manual
      runs-on: ubuntu-latest
      permissions:
        contents: write 
      steps:
        - name: Checkout Repository Code
          uses: actions/checkout@v4

        - name: Install Doxygen and Extension Parsers
          run: |
            sudo apt-get update
            sudo apt-get install -y doxygen graphviz
            pip install doxypypy

        - name: Run Doxygen Compiler Execution
          run: |
            doxygen Doxyfile

        - name: Deploy Compiled HTML to GitHub Pages
          uses: peaceiris/actions-gh-pages@v4
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./docs/html