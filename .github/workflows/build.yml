name: Build Portable Windows App

on:
  push:
    branches:
      - 'feature/setup-portable-windows-build'
      - 'dev'

jobs:
  build-windows:
    name: Compile Application for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 shiboken6 pyinstaller

      - name: Run PyInstaller Compiler
        run: |
          pyinstaller --noconsole --name="UBS_Signage" --add-data "app_assets;app_assets" main.py

      - name: Create External Portable Resource Folders
        run: |
          New-Item -ItemType Directory -Force -Path "dist/UBS_Signage/resources/images"
          New-Item -ItemType Directory -Force -Path "dist/UBS_Signage/resources/videos"
        shell: powershell

      - name: Pack into Portable ZIP Archive
        run: |
          Compress-Archive -Path "dist/UBS_Signage/*" -DestinationPath "UBS_Signage_Portable_Windows.zip"
        shell: powershell

      - name: Upload Finished Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portable_Windows_Build
          path: UBS_Signage_Portable_Windows.zip
          retention-days: 5