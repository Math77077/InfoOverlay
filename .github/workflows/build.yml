name: Build Portable Windows App

on:
  push:
    branches:
      - 'main'
      - 'dev'
      - 'hotfix/**'
  pull_request:
    branches:
      - 'main'
      - 'dev'

jobs:
  build-windows:
    name: Compile Application for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 shiboken6 pyinstaller xhtml2pdf markdown

      - name: Run PyInstaller Compiler
        run: |
          pyinstaller --noconsole --name="UBS_Signage" --add-data "app_assets;app_assets" main.py

      - name: Structuring Runtime Folders and SmartScreen Patch
        run: |
          # Create reliable runtime resource folders expected by AssetService
          New-Item -ItemType Directory -Force -Path "dist/UBS_Signage/resources/images"
          New-Item -ItemType Directory -Force -Path "dist/UBS_Signage/resources/videos"
          
          # Generate a root-level Batch launcher script to bypass direct SmartScreen binary blocks
          $BatContent = "@echo off`nstart `"`" `"%~dp0UBS_Signage\UBS_Signage.exe`""
          Out-File -FilePath "dist/Iniciar.bat" -InputObject $BatContent -Encoding ascii
        shell: powershell

      - name: Compile USER_MANUAL.md to Production PDF
        run: |
          python -c "
          import markdown
          from xhtml2pdf import pisa
          with open('USER_MANUAL.md', 'r', encoding='utf-8') as f:
              md_content = f.read()
          html_content = f'<html><head><style>body {{ font-family: Arial, sans-serif; padding: 40px; color: #333; line-height: 1.6; }} h1 {{ color: #056e9b; border-bottom: 2px solid #056e9b; padding-bottom: 8px; }} h2 {{ color: #1f2833; margin-top: 30px; }} h3 {{ color: #459cd6; }} code {{ background: #f4f4f4; padding: 3px 6px; font-family: Consolas, monospace; border-radius: 4px; }} table {{ border-collapse: collapse; width: 100%; margin-top: 15px; }} th, td {{ border: 1px solid #ccb3b3; padding: 10px; text-align: left; }} th {{ background-color: #f8f9fa; color: #056e9b; }} blockquote {{ margin: 20px 0; padding: 15px; background-color: #fff3cd; border-left: 5px solid #ffc107; color: #856404; }}</style></head><body>{markdown.markdown(md_content, extensions=[\"extra\"])}</body></html>'
          with open('dist/Manual_do_Usuario.pdf', 'wb') as f_out:
              pisa.CreatePDF(html_content, dest=f_out)
          "
        shell: powershell

      - name: Pack into Portable ZIP Archive
        run: |
          # Compress from the root of the dist directory to include the launcher
          Compress-Archive -Path "dist/*" -DestinationPath "UBS_Signage_Portable_Windows.zip"
        shell: powershell

      - name: Upload Finished Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portable_Windows_Build
          path: UBS_Signage_Portable_Windows.zip
          retention-days: 7

  deploy-docs:
      name: Compile and Publish Doxygen Reference Manual
      runs-on: ubuntu-latest
      permissions:
        contents: write 
      steps:
        - name: Checkout Repository Code
          uses: actions/checkout@v4

        - name: Install Doxygen and Extension Parsers
          run: |
            sudo apt-get update
            sudo apt-get install -y doxygen graphviz
            pip install doxypypy

        - name: Run Doxygen Compiler Execution
          run: |
            doxygen Doxyfile

        - name: Deploy Compiled HTML to GitHub Pages
          uses: peaceiris/actions-gh-pages@v4
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./docs/html